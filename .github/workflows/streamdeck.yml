# Checks and packages the Stream Deck plugin when a `deck-v*` tag is pushed.
# It runs only on release tags (not on PRs or branch pushes), so forks of this
# public repo can't start builds. Pushing a tag requires write access.
#
# A tag builds the .streamDeckPlugin against production and attaches it to a
# GitHub Release. Uploading it to Maker Console stays manual: Elgato has no
# publish API.
#
# Release builds read two repository variables (Settings → Secrets and
# variables → Actions → Variables):
#   STREAMDECK_CONVEX_URL      production Convex URL (Vercel's NEXT_PUBLIC_CONVEX_URL)
#   STREAMDECK_DASHBOARD_URL   https://nxtbot.app

name: Stream Deck

on:
    push:
        tags:
            - deck-v*

concurrency:
    group: streamdeck-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Check
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - uses: useblacksmith/checkout@v1
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm turbo run typecheck test --filter=@nxt/streamdeck
            # The validator checks the manifest's CodePath, so build first.
            - run: pnpm --filter @nxt/streamdeck build
            - run: pnpm --filter @nxt/streamdeck validate:plugin

    release:
        name: Package and release
        needs: check
        if: startsWith(github.ref, 'refs/tags/deck-v')
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: write
        env:
            CONVEX_URL: ${{ vars.STREAMDECK_CONVEX_URL }}
            DASHBOARD_URL: ${{ vars.STREAMDECK_DASHBOARD_URL }}
        steps:
            - uses: useblacksmith/checkout@v1
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            # deck-v0.2.0 must match manifest Version 0.2.0.0, so a release
            # never ships a version Maker Console has already seen.
            - name: Check the tag matches the manifest
              run: |
                  tag="${GITHUB_REF_NAME#deck-v}"
                  manifest=$(node -p "require('./apps/streamdeck/dev.zedsoftworks.nxtbot.sdPlugin/manifest.json').Version")
                  if [ "$tag.0" != "$manifest" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME needs manifest Version $tag.0, found $manifest."
                      exit 1
                  fi

            # Refuses to run without CONVEX_URL or with a localhost DASHBOARD_URL.
            - run: pnpm package:deck

            - name: Create the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                      apps/streamdeck/dist/dev.zedsoftworks.nxtbot.streamDeckPlugin \
                      --title "Stream Deck $GITHUB_REF_NAME" \
                      --generate-notes
